# Runs when this lab is the root of its own repository (GitHub only reads workflows from the
# repository root). If the lab lives inside a monorepo, copy ci/monorepo-workflow.yml to
# <repo root>/.github/workflows/ticketflow-reliability-lab.yml instead; it sets the working directory.
name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.10", "3.12"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -B -m unittest discover -s tests
      - run: python -B scripts/run_simulation.py
      - run: python -B scripts/run_qa_eval.py all
      - run: python -B scripts/mutate.py
